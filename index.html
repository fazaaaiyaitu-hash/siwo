<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>DripClient - Jual Produk Digital</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <nav>
        <div class="container">
            <h1><i class="fas fa-droplet"></i> DripClient</h1>
            <div class="nav-links">
                <a href="#" id="cartIcon" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cartCount" class="cart-count">0</span>
                </a>
            </div>
        </div>
    </nav>

    <main>
        <div class="container">
            <!-- Hero Section -->
            <div class="hero">
                <h2>Produk Digital Berkualitas</h2>
                <p>Download langsung setelah pembayaran</p>
            </div>

            <!-- Daftar Produk -->
            <div class="products-grid" id="productsGrid">
                <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading produk...</div>
            </div>
        </div>
    </main>

    <!-- Modal Detail & Pilih Durasi -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Modal Keranjang -->
    <div id="cartModal" class="modal">
        <div class="modal-content modal-large">
            <span class="close">&times;</span>
            <h2><i class="fas fa-shopping-cart"></i> Keranjang</h2>
            <div id="cartBody">
                <div class="cart-empty"><i class="fas fa-shopping-cart"></i> Keranjang kosong</div>
            </div>
        </div>
    </div>

    <!-- Modal Checkout -->
    <div id="checkoutModal" class="modal">
        <div class="modal-content modal-large">
            <span class="close">&times;</span>
            <h2><i class="fas fa-credit-card"></i> Checkout</h2>
            <div id="checkoutBody"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
