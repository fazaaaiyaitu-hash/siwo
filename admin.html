<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - DigitalStore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="container">
            <h1>CPanel</h1>
            <div class="nav-links">
                <span id="adminEmail"></span>
                <button id="logoutBtn" class="btn-logout" style="display: none;">Logout</button>
            </div>
        </div>
    </nav>

    <main>
        <div class="container">
            <!-- FORM LOGIN -->
            <div id="authSection" class="auth-section">
                <h2>Login Admin</h2>
                <form id="loginForm">
                    <input type="email" id="loginEmail" placeholder="Email" required autocomplete="off">
                    <input type="password" id="loginPassword" placeholder="Password" required>
                    <button type="submit" id="loginBtn">Login</button>
                    <div id="loginMessage" class="login-attempts"></div>
                </form>
                
                <!-- Informasi OTP -->
                <div class="otp-info">
                    <p>🔐 <strong>Cara Login:</strong></p>
                    <ol>
                        <li>Masukkan email & password admin</li>
                        <li>Kode OTP 6 digit akan muncul di <strong>alert</strong></li>
                        <li>Masukkan kode OTP ke kotak dialog</li>
                        <li>Kode berlaku <strong>5 menit</strong></li>
                    </ol>
                </div>
            </div>

            <!-- Admin Panel (hanya tampil setelah login) -->
            <div id="adminPanel" style="display:none;">
                <div class="admin-header">
                    <h2>Manajemen Produk</h2>
                    <button id="addProductBtn">+ Tambah Produk</button>
                </div>

                <div id="productsTable" class="products-table">
                    <table>
                        <thead>
                            <tr><th>Nama</th><th>Harga</th><th>File</th><th>Aksi</th></tr>
                        </thead>
                        <tbody id="adminProductsList"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Session timeout indicator -->
    <div id="sessionTimer" class="session-timer"></div>

    <!-- Modal Tambah/Edit Produk -->
<div id="productFormModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h3 id="modalTitle">Tambah Produk</h3>
        <form id="productForm">
            <input type="text" id="productName" placeholder="Nama Produk" required>
            <textarea id="productDesc" placeholder="Deskripsi" rows="4" required></textarea>
            <input type="number" id="productPrice" placeholder="Harga (Rp)" required>
            <input type="text" id="productFileUrl" placeholder="URL file (Google Drive, Dropbox, dll)" required>
            <button type="submit" id="saveProductBtn">Simpan</button>
        </form>
    </div>
</div>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="admin.js"></script>
</body>
</html>
