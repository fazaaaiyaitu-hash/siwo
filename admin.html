<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - DigitalStore</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Sembunyikan admin panel dari search engine */
        .no-index {
            display: none;
        }
        
        /* Proteksi brute force */
        .login-attempts {
            color: red;
            font-size: 12px;
            margin-top: 5px;
        }
        
        /* Session timeout indicator */
        .session-timer {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: #333;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            display: none;
        }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <h1>🔧 Admin Panel</h1>
            <div class="nav-links">
                <span id="adminEmail" style="margin-right: 15px;"></span>
                <button id="logoutBtn" class="btn-logout">Logout</button>
            </div>
        </div>
    </nav>

    <main>
        <div class="container">
            <!-- HANYA FORM LOGIN - tanpa register -->
            <div id="authSection" class="auth-section">
                <h2>Login Admin</h2>
                <form id="loginForm">
                    <input type="email" id="loginEmail" placeholder="Email" required autocomplete="off">
                    <input type="password" id="loginPassword" placeholder="Password" required>
                    <button type="submit" id="loginBtn">Login</button>
                    <div id="loginMessage" class="login-attempts"></div>
                </form>
                <!-- Tombol registrasi dihapus -->
            </div>

            <!-- Admin Panel (hanya tampil setelah login) -->
            <div id="adminPanel" style="display:none;">
                <div class="admin-header">
                    <h2>Manajemen Produk</h2>
                    <button id="addProductBtn">+ Tambah Produk</button>
                </div>

                <div id="productsTable" class="products-table">
                    <table>
                        <thead>
                            <tr><th>Nama</th><th>Harga</th><th>File URL</th><th>Aksi</th></tr>
                        </thead>
                        <tbody id="adminProductsList"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Session timeout indicator -->
    <div id="sessionTimer" class="session-timer"></div>

    <!-- Modal Tambah/Edit Produk -->
    <div id="productFormModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3 id="modalTitle">Tambah Produk</h3>
            <form id="productForm">
                <input type="text" id="productName" placeholder="Nama Produk" required>
                <textarea id="productDesc" placeholder="Deskripsi" required></textarea>
                <input type="number" id="productPrice" placeholder="Harga (Rp)" required>
                <input type="file" id="productFile" accept=".zip,.pdf,.rar,.jpg,.png">
                <input type="text" id="productFileUrl" placeholder="Atau URL file langsung">
                <button type="submit">Simpan</button>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="admin.js"></script>
</body>
</html>
